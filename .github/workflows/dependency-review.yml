name: Dependency Review

on:
  pull_request:
    paths:
      - 'requirements.txt'
      - 'frontend/package-lock.json'
      - 'frontend/package.json'

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
      
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
