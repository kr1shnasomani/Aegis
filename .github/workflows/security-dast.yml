name: Security DAST Scan

on:
  schedule:
    - cron: "30 2 * * 0" # Run weekly on Sunday
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  dast:
    name: OWASP ZAP API Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Start Backend Services
        run: |
          docker compose up -d backend db qdrant
          # Wait for backend to be healthy
          sleep 30

      - name: ZAP API Scan
        uses: zaproxy/action-api-scan@77dfa9a647bb0f583e39d4df8531634d6ddd8df4 # v0.9.0
        with:
          target: "http://localhost:8000/api/v1/openapi.json"
          format: openapi
          fail_action: false
          allow_issue_writing: false

      - name: Upload ZAP Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zap-report
          path: report_html.html
